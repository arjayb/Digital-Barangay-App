<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Staff login for the Digital Barangay App">
  <meta name="robots" content="noindex">
  <title>Staff Login — Digital Barangay App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
  <header class="hall-header">
    <div class="hall-header__inner">
      <div class="seal" aria-hidden="true">BSI</div>
      <div>
        <p class="eyebrow">Staff Access</p>
        <h1>Barangay San Isidro</h1>
        <p class="tagline">Sign in to manage requests, notices, and concerns.</p>
      </div>
    </div>
  </header>

  <main class="admin-shell">
    <form id="admin-login-form" class="counter-form admin-login-card" novalidate>
      <h3>Admin sign in</h3>
      <p class="hint">This login is for barangay staff only. Residents should use the front desk to submit and track requests instead.</p>

      <div id="login-error" class="form-alert" hidden></div>

      <label for="admin-email">Email <span aria-hidden="true">*</span></label>
      <input id="admin-email" type="email" autocomplete="username" required>

      <label for="admin-password">Password <span aria-hidden="true">*</span></label>
      <input id="admin-password" type="password" autocomplete="current-password" required>

      <button type="submit" class="btn btn--green" id="login-submit">Sign in</button>
    </form>
  </main>

  <footer class="hall-footer">
    <p>Digital Barangay App — staff portal</p>
    <span><a href="index.html">Back to the front desk</a></span>
  </footer>

  <script src="api.js"></script>
  <script src="admin-login.js"></script>
</body>
</html>
